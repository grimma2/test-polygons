<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VAST player frame</title>
<script src="../tracking-codes.js"></script>
<link rel="stylesheet" href="../shared/media.css">
<style>
html,body{margin:0;background:#000;height:100%}
#ad-slot,#player{width:100%;height:100%;min-height:360px}
</style>
</head>
<body>
<div id="ad-slot"><div id="player"></div></div>
<script src="../shared/kinescope.js"></script>
<script>
(function(){
  var xml = VisiblaInject.vastXml('vast');
  if (!xml) {
    VisiblaInject.showPending('#ad-slot', 'vast', 'xml');
    return;
  }
  VisiblaKinescope.create('player', { xml: xml, height: 400 });
})();
</script>
</body>
</html>
