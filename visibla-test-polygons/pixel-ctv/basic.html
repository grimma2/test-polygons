<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pixel CTV — Visibla Test</title>
<script src="../tracking-codes.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:#0d1117;color:#c9d1d9;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;min-height:100vh}
.panel{position:sticky;top:0;z-index:1000;background:#161b22;border-bottom:2px solid #30363d;padding:14px 24px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.panel h2{color:#58a6ff;margin-right:auto;font-size:.95rem}
.panel .metric{background:#21262d;border:1px solid #30363d;border-radius:8px;padding:7px 12px;min-width:85px}
.panel .metric .label{font-size:.6rem;color:#8b949e;text-transform:uppercase}
.panel .metric .value{font-size:1.1rem;font-weight:700;color:#58a6ff}
.panel .metric .value.green{color:#3fb950}
.panel .metric .value.red{color:#f85149}
.content{max-width:760px;margin:30px auto;padding:0 20px}
.card{background:#161b22;border:1px solid #30363d;border-radius:12px;padding:20px}
.card h3{color:#58a6ff;margin-bottom:8px;font-size:1rem}
.hint{color:#8b949e;font-size:.8rem;line-height:1.5;margin-bottom:12px}
.raw-label{color:#8b949e;font-size:.75rem;margin:12px 0 6px}
.actions{display:flex;gap:10px;margin-top:16px}
.actions button{padding:10px 18px;background:#58a6ff;color:#0d1117;border:none;border-radius:8px;cursor:pointer;font-weight:600}
.request-log{background:#0d1117;border:1px solid #30363d;border-radius:8px;padding:12px;font-size:.75rem;font-family:monospace;max-height:180px;overflow-y:auto;margin-top:12px}
.request-log .entry{padding:3px 0;border-bottom:1px solid #21262d;color:#3fb950}
</style>
</head>
<body>
<div class="panel">
  <h2>Pixel CTV — URL показа</h2>
  <div class="metric"><div class="label">Format</div><div class="value" id="fmtState">—</div></div>
  <div class="metric"><div class="label">Requests</div><div class="value" id="reqCount">0</div></div>
</div>
<div class="content">
  <div class="card">
    <h3>Вкладка 1 — URL показа Smart</h3>
    <p class="hint">Коллектор <code>/pixel/smart/{project}/track.gif</code>. Клика и <code>redirect</code> нет. Макрос <code>&lt;app_id&gt;</code> в тесте → <code>test.bundle</code>.</p>
    <p class="raw-label">Сырой сниппет pixel_ctv.impressionUrl</p>
    <pre id="rawSnippet"></pre>
    <div class="actions">
      <button type="button" id="btnFire">Fire CTV impression</button>
    </div>
    <div class="request-log" id="reqLog"><div class="entry">Ожидание действия…</div></div>
  </div>
</div>
<script>
(function(){
  var reqCount = 0;
  var reqLog = document.getElementById('reqLog');
  var reqCountEl = document.getElementById('reqCount');
  var fmtState = document.getElementById('fmtState');
  var ready = VisiblaInject.isReady('pixel_ctv', 'impressionUrl');
  fmtState.textContent = ready ? 'READY' : 'PENDING';
  fmtState.className = 'value ' + (ready ? 'green' : 'red');

  VisiblaInject.showRaw('#rawSnippet', 'pixel_ctv', 'impressionUrl');

  function log(msg){
    reqCount++;
    reqCountEl.textContent = reqCount;
    var d = document.createElement('div');
    d.className = 'entry';
    d.textContent = new Date().toLocaleTimeString() + ' — ' + msg;
    reqLog.insertBefore(d, reqLog.firstChild);
  }

  document.getElementById('btnFire').addEventListener('click', function(){
    if(!VisiblaInject.isReady('pixel_ctv', 'impressionUrl')){
      log('impressionUrl pending — коллектор не вызывается');
      return;
    }
    var url = VisiblaInject.beacon(VisiblaInject.get('pixel_ctv', 'impressionUrl'));
    log('CTV impression: ' + url);
  });
})();
</script>
</body>
</html>
