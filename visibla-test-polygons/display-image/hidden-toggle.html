<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hidden Toggle — Visibla Test</title>
<script src="../tracking-codes.js"></script>
<link rel="stylesheet" href="../shared/hud.css">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:#0d1117;color:#c9d1d9;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;min-height:100vh}
.panel{position:sticky;top:0;z-index:1000;background:#161b22;border-bottom:2px solid #30363d;padding:14px 24px;display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.panel h2{color:#58a6ff;margin-right:auto;font-size:.95rem}
.panel .metric{background:#21262d;border:1px solid #30363d;border-radius:8px;padding:7px 12px;min-width:90px}
.panel .metric .label{font-size:.65rem;color:#8b949e;text-transform:uppercase}
.panel .metric .value{font-size:1.2rem;font-weight:700;color:#58a6ff}
.panel .metric .value.green{color:#3fb950}
.panel .metric .value.red{color:#f85149}
.panel .metric .value.yellow{color:#d2991d}
.controls{display:flex;gap:10px;padding:20px;justify-content:center;flex-wrap:wrap}
.controls button{padding:10px 22px;border:1px solid #30363d;border-radius:8px;background:#21262d;color:#c9d1d9;cursor:pointer;font-size:.9rem;transition:all .15s}
.controls button:hover{background:#30363d;border-color:#58a6ff}
.controls button.active{background:#1b3a2a;border-color:#3fb950;color:#3fb950}
.controls button.danger{background:#3a1b1b;border-color:#f85149;color:#f85149}
.banner-zone{display:flex;justify-content:center;padding:30px 0}
.visibla-container{position:relative;width:300px;height:250px;overflow:hidden;background:#fff;border:3px solid #f85149;border-radius:4px;transition:border-color .3s,opacity .3s}
.visibla-container.viewable{border-color:#3fb950}
.visibla-container.hidden-banner,#ad-slot.hidden-banner{display:none}
.visibla-container img{width:100%;height:100%;object-fit:cover}
.indicator{position:absolute;top:6px;right:6px;width:12px;height:12px;border-radius:50%;background:#f85149;transition:background .3s;z-index:10}
.visibla-container.viewable .indicator{background:#3fb950}
.state-label{text-align:center;font-size:.85rem;color:#8b949e;padding:8px}
.state-label span{font-weight:700;color:#d2991d}
.raw-label{text-align:center;color:#8b949e;font-size:.75rem;margin:8px 0 6px}
</style>
</head>
<body>
<div class="hud">
  <h2>Toggle — display:none</h2>
  <a href="../index.html">На главную</a>
  <div class="metric"><div class="label">Visibility %</div><div class="value red" id="visPct">0%</div></div>
  <div class="metric"><div class="label">MRC</div><div class="value red" id="mrc">NO</div></div>
  <div class="metric"><div class="label">State</div><div class="value yellow" id="dispState">VISIBLE</div></div>
  <div class="metric"><div class="label">Pulses</div><div class="value" id="pulses">0</div></div>
</div>
<div class="controls">
  <button id="btnShow" class="active" onclick="showBanner()">Show Banner</button>
  <button id="btnHide" class="danger" onclick="hideBanner()">Hide (display:none)</button>
</div>
<div class="state-label">Banner: <span id="stateText" style="color:#3fb950">VISIBLE</span></div>
<div class="banner-zone">
  <div id="ad-slot"></div>
</div>
<p class="raw-label">Сырой сниппет image_display.smartTag</p>
<pre id="rawSnippet"></pre>

<script>
(function(){
  VisiblaInject.showRaw('#rawSnippet', 'image_display', 'smartTag');
  VisiblaInject.mountFormat('#ad-slot', 'image_display', 'smartTag');

  var slot = document.getElementById('ad-slot');
  var visPct = document.getElementById('visPct');
  var mrc = document.getElementById('mrc');
  var dispState = document.getElementById('dispState');
  var pulses = document.getElementById('pulses');
  var stateText = document.getElementById('stateText');
  var pCount = 0, hidden = false;

  function banner(){
    return document.querySelector('#ad-slot .visibla-container') || slot;
  }

  window.showBanner = function(){
    hidden = false; slot.classList.remove('hidden-banner');
    stateText.textContent = 'VISIBLE'; stateText.style.color = '#3fb950';
    dispState.textContent = 'VISIBLE'; dispState.className = 'value green';
    document.getElementById('btnShow').classList.add('active');
    document.getElementById('btnHide').classList.remove('active');
    updateVisibility();
  };
  window.hideBanner = function(){
    hidden = true; slot.classList.add('hidden-banner');
    stateText.textContent = 'HIDDEN'; stateText.style.color = '#f85149';
    dispState.textContent = 'HIDDEN'; dispState.className = 'value red';
    document.getElementById('btnHide').classList.add('active');
    document.getElementById('btnShow').classList.remove('active');
    visPct.textContent = '0%'; visPct.className = 'value red';
    mrc.textContent = 'NO'; mrc.className = 'value red';
    var el = banner();
    if(el) el.classList.remove('viewable');
  };
  function updateVisibility(){
    if(hidden) return;
    var el = banner();
    if(!el) return;
    var rect = el.getBoundingClientRect();
    var vw=window.innerWidth, vh=window.innerHeight;
    var visW=Math.max(0,Math.min(rect.right,vw)-Math.max(rect.left,0));
    var visH=Math.max(0,Math.min(rect.bottom,vh)-Math.max(rect.top,0));
    var pct=rect.width*rect.height>0?Math.round((visW*visH/(rect.width*rect.height))*100):0;
    visPct.textContent=pct+'%'; visPct.className='value '+(pct>=50?'green':'red');
    var isMRC=pct>=50;
    mrc.textContent=isMRC?'YES':'NO'; mrc.className='value '+(isMRC?'green':'red');
    el.classList.toggle('viewable',isMRC);
    if(isMRC)pCount++; pulses.textContent=pCount;
  }
  window.addEventListener('scroll',updateVisibility,{passive:true});
  window.addEventListener('resize',updateVisibility,{passive:true});
  updateVisibility();
})();
</script>
</body>
</html>
