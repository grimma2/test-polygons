<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Multi-Banner — Visibla Test</title>
<script src="../tracking-codes.js"></script>
<link rel="stylesheet" href="../shared/hud.css">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:#0d1117;color:#c9d1d9;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
.panel{position:sticky;top:0;z-index:1000;background:#161b22;border-bottom:2px solid #30363d;padding:14px 24px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.panel h2{color:#58a6ff;margin-right:auto;font-size:.95rem}
.panel .tracker-row{display:flex;gap:8px;align-items:center;background:#21262d;border-radius:8px;padding:6px 12px;border:1px solid #30363d}
.panel .tracker-row .t-label{font-size:.7rem;color:#8b949e}
.panel .tracker-row .t-val{font-size:.85rem;font-weight:700;color:#58a6ff}
.panel .tracker-row .t-val.green{color:#3fb950}
.panel .tracker-row .t-val.red{color:#f85149}
.spacer{height:600px;display:flex;align-items:center;justify-content:center;color:#30363d}
.banner-row{display:flex;justify-content:center;gap:30px;flex-wrap:wrap;padding:40px 0}
.visibla-container{position:relative;width:300px;height:250px;overflow:hidden;background:#fff;border:3px solid #f85149;border-radius:4px;transition:border-color .3s}
.visibla-container.viewable{border-color:#3fb950}
.visibla-container img{width:100%;height:100%;object-fit:cover}
.indicator{position:absolute;top:6px;right:6px;width:10px;height:10px;border-radius:50%;background:#f85149;transition:background .3s;z-index:10}
.visibla-container.viewable .indicator{background:#3fb950}
.banner-label{position:absolute;top:6px;left:6px;background:rgba(0,0,0,.7);color:#fff;font-size:.65rem;padding:2px 6px;border-radius:3px;z-index:10}
.raw-label{text-align:center;color:#8b949e;font-size:.75rem;margin:8px 0 6px}
.slot-wrap{display:flex;flex-direction:column;align-items:center;gap:6px}
.slot-wrap .banner-label{position:static}
</style>
</head>
<body>
<div class="hud">
  <h2>Multi-Banner (×3)</h2>
  <a href="../index.html">На главную</a>
  <div class="tracker-row"><span class="t-label">B1</span><span class="t-val red" id="mrc1">NO</span><span class="t-val" id="pct1">0%</span></div>
  <div class="tracker-row"><span class="t-label">B2</span><span class="t-val red" id="mrc2">NO</span><span class="t-val" id="pct2">0%</span></div>
  <div class="tracker-row"><span class="t-label">B3</span><span class="t-val red" id="mrc3">NO</span><span class="t-val" id="pct3">0%</span></div>
</div>
<div class="spacer">▲ Scroll down to see 3 banners ▼</div>
<div class="banner-row" id="bannerRow">
  <div class="slot-wrap"><div class="banner-label">Slot 1</div><div id="ad-slot-1"></div></div>
  <div class="slot-wrap"><div class="banner-label">Slot 2</div><div id="ad-slot-2"></div></div>
  <div class="slot-wrap"><div class="banner-label">Slot 3</div><div id="ad-slot-3"></div></div>
</div>
<p class="raw-label">Один сниппет image_display.smartTag на все три слота</p>
<pre id="rawSnippet"></pre>
<div class="spacer">▲ Banners are above ▲</div>
<script>
(function(){
  VisiblaInject.showRaw('#rawSnippet', 'image_display', 'smartTag');
  VisiblaInject.mountFormat('#ad-slot-1', 'image_display', 'smartTag');
  VisiblaInject.mountFormat('#ad-slot-2', 'image_display', 'smartTag');
  VisiblaInject.mountFormat('#ad-slot-3', 'image_display', 'smartTag');

  function checkBanner(slotId, mrcId, pctId){
    var slot = document.getElementById(slotId);
    var el = slot.querySelector('.visibla-container') || slot;
    var rect = el.getBoundingClientRect();
    var vw = window.innerWidth, vh = window.innerHeight;
    var visW = Math.max(0, Math.min(rect.right, vw) - Math.max(rect.left, 0));
    var visH = Math.max(0, Math.min(rect.bottom, vh) - Math.max(rect.top, 0));
    var visArea = visW * visH;
    var total = rect.width * rect.height;
    var pct = total > 0 ? Math.round((visArea/total)*100) : 0;
    document.getElementById(pctId).textContent = pct + '%';
    var isMRC = pct >= 50;
    document.getElementById(mrcId).textContent = isMRC ? 'YES ✓' : 'NO';
    document.getElementById(mrcId).className = 't-val ' + (isMRC ? 'green' : 'red');
    el.classList.toggle('viewable', isMRC);
  }

  function updateAll(){
    checkBanner('ad-slot-1','mrc1','pct1');
    checkBanner('ad-slot-2','mrc2','pct2');
    checkBanner('ad-slot-3','mrc3','pct3');
  }

  window.addEventListener('scroll', updateAll, {passive:true});
  window.addEventListener('resize', updateAll, {passive:true});
  updateAll();
})();
</script>
</body>
</html>
