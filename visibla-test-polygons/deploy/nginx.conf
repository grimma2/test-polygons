server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    autoindex off;

    location ~ /\. {
        deny all;
    }

    location ~* ^/(docker-compose\.ya?ml|Dockerfile)$ {
        deny all;
    }

    location = /tracking-codes.js {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    location ~* \.html$ {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    location ~* \.(css|js|png|jpg|jpeg|gif|svg|ico|xml)$ {
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
