<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HTML5 Animation Banner — Visibla Test</title>
<script src="../tracking-codes.js"></script>
<link rel="stylesheet" href="../shared/hud.css">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:#0d1117;color:#c9d1d9;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
.panel{position:sticky;top:0;z-index:1000;background:#161b22;border-bottom:2px solid #30363d;padding:14px 24px;display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.panel h2{color:#58a6ff;margin-right:auto;font-size:.95rem}
.panel .metric{background:#21262d;border:1px solid #30363d;border-radius:8px;padding:7px 12px;min-width:85px}
.panel .metric .label{font-size:.65rem;color:#8b949e;text-transform:uppercase}
.panel .metric .value{font-size:1.2rem;font-weight:700;color:#58a6ff}
.panel .metric .value.green{color:#3fb950}
.panel .metric .value.red{color:#f85149}
.spacer{height:1000px;display:flex;align-items:center;justify-content:center;color:#30363d}
.banner-zone{display:flex;justify-content:center;padding:40px 0}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.03)}}
@keyframes colorShift{0%{background:#1a3a5c}33%{background:#3a1a5c}66%{background:#1a5c3a}100%{background:#1a3a5c}}
@keyframes spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
@keyframes fadeBg{0%,100%{opacity:0.3}50%{opacity:0.7}}
.visibla-container{position:relative;width:300px;height:250px;overflow:hidden;border:3px solid #f85149;border-radius:4px;transition:border-color .3s;animation:pulse 2s ease-in-out infinite}
.visibla-container.viewable{border-color:#3fb950}
.visibla-container .inner{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;animation:colorShift 6s linear infinite;position:relative}
.visibla-container .spin-icon{font-size:3rem;animation:spin 4s linear infinite;display:inline-block}
.visibla-container .title{font-size:1.1rem;font-weight:700;color:#fff;margin-top:8px;text-shadow:0 0 10px rgba(88,166,255,.5)}
.visibla-container .subtitle{font-size:.75rem;color:#8b949e;margin-top:4px}
.visibla-container .pulse-dot{position:absolute;width:40px;height:40px;border-radius:50%;background:rgba(88,166,255,.15);animation:fadeBg 1.5s ease-in-out infinite}
.visibla-container .click-btn{display:inline-block;margin-top:12px;padding:6px 16px;background:#58a6ff;color:#fff;border:none;border-radius:4px;cursor:pointer;font-size:.75rem;transition:background .2s}
.visibla-container .click-btn:hover{background:#79c0ff}
.indicator{position:absolute;top:4px;right:4px;width:10px;height:10px;border-radius:50%;background:#f85149;transition:background .3s;z-index:10}
.visibla-container.viewable .indicator{background:#3fb950}
.raw-label{text-align:center;color:#8b949e;font-size:.75rem;margin:8px 0 6px}
</style>
</head>
<body>
<div class="hud">
  <h2>HTML5 CSS Animation</h2>
  <a href="../index.html">На главную</a>
  <div class="metric"><div class="label">Visibility %</div><div class="value red" id="visPct">0%</div></div>
  <div class="metric"><div class="label">MRC</div><div class="value red" id="mrc">NO</div></div>
  <div class="metric"><div class="label">Clicks</div><div class="value" id="clicks">0</div></div>
  <div class="metric"><div class="label">Pulses</div><div class="value" id="pulses">0</div></div>
</div>
<div class="spacer">▲ Scroll down to see animated HTML5 banner ▼</div>
<div class="banner-zone">
  <meta name="ad.size" content="width=300,height=250">
    <div class="visibla-container" id="banner">
    <div class="indicator"></div>
    <div class="inner">
      <span class="spin-icon">⚡</span>
      <span class="title">Dynamic HTML5</span>
      <span class="subtitle">CSS Animated Banner</span>
      <div class="pulse-dot" style="top:20px;left:30px"></div>
      <div class="pulse-dot" style="bottom:30px;right:40px;animation-delay:.75s"></div>
      <button class="click-btn" id="ctaBtn" onclick="trackClick(event)">Click Me →</button>
    </div>
    <div id="ad-slot"></div>
  </div>
</div>
<p class="raw-label">Сырой сниппет html5_display.inBanner</p>
<pre id="rawSnippet"></pre>
<div class="spacer">▲ Banner above ▲</div>
<script>
(function(){
  VisiblaInject.showRaw('#rawSnippet', 'html5_display', 'inBanner');
  VisiblaInject.mountFormat('#ad-slot', 'html5_display', 'inBanner');

  var banner=document.getElementById('banner'),visPct=document.getElementById('visPct');
  var mrc=document.getElementById('mrc'),clickEl=document.getElementById('clicks');
  var pulses=document.getElementById('pulses'),pCount=0,cCount=0;

  window.trackClick=function(e){
    e.stopPropagation();cCount++;clickEl.textContent=cCount;
  };

  banner.addEventListener('click',function(e){
    if(e.target.id==='ctaBtn')return;cCount++;clickEl.textContent=cCount;
  });

  function update(){
    var rect=banner.getBoundingClientRect(),vw=window.innerWidth,vh=window.innerHeight;
    var visW=Math.max(0,Math.min(rect.right,vw)-Math.max(rect.left,0));
    var visH=Math.max(0,Math.min(rect.bottom,vh)-Math.max(rect.top,0));
    var pct=rect.width*rect.height>0?Math.round((visW*visH/(rect.width*rect.height))*100):0;
    visPct.textContent=pct+'%';visPct.className='value '+(pct>=50?'green':'red');
    var ok=pct>=50;mrc.textContent=ok?'YES':'NO';mrc.className='value '+(ok?'green':'red');
    banner.classList.toggle('viewable',ok);if(ok)pCount++;pulses.textContent=pCount;
  }
  window.addEventListener('scroll',update,{passive:true});
  window.addEventListener('resize',update,{passive:true});
  update();
})();
</script>
</body>
</html>
