<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Iframe Test — Visibla Edge Case</title>
<script src="../tracking-codes.js"></script>
<link rel="stylesheet" href="../shared/hud.css">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:#0d1117;color:#c9d1d9;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
.panel{position:sticky;top:0;z-index:1000;background:#161b22;border-bottom:2px solid #30363d;padding:14px 24px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.panel h2{color:#58a6ff;margin-right:auto;font-size:.95rem}
.panel .metric{background:#21262d;border:1px solid #30363d;border-radius:8px;padding:7px 12px;min-width:90px}
.panel .metric .label{font-size:.6rem;color:#8b949e;text-transform:uppercase}
.panel .metric .value{font-size:1.1rem;font-weight:700;color:#58a6ff}
.panel .metric .value.green{color:#3fb950}
.panel .metric .value.red{color:#f85149}
.iframe-zone{display:flex;justify-content:center;padding:30px 0}
.iframe-zone iframe{border:3px solid #30363d;border-radius:4px;background:#fff}
.info{text-align:center;padding:12px;color:#8b949e;font-size:.8rem}
.raw-label{text-align:center;color:#8b949e;font-size:.75rem;margin:8px 0 6px}
</style>
</head>
<body>
<div class="hud">
  <h2>Iframe — Image Smart Tag</h2>
  <a href="../index.html">На главную</a>
  <div class="metric"><div class="label">Iframe Visible</div><div class="value green" id="iframeVis">YES</div></div>
  <div class="metric"><div class="label">Msg Received</div><div class="value" id="msgCount">0</div></div>
</div>
<div class="info">Тот же <code>image_display.smartTag</code> внутри iframe. SDK работает внутри iframe.</div>
<div class="iframe-zone" id="iframeZone">
  <div id="ad-slot"></div>
</div>
<p class="raw-label">Сырой сниппет image_display.smartTag</p>
<pre id="rawSnippet"></pre>
<script>
(function(){
  VisiblaInject.showRaw('#rawSnippet', 'image_display', 'smartTag');
  var msgCount = 0;
  window.addEventListener('message', function(e){
    if(e.data && e.data.type === 'visibla-iframe'){
      msgCount++;
      document.getElementById('msgCount').textContent = msgCount;
    }
  });

  if(!VisiblaInject.isReady('image_display', 'smartTag')){
    VisiblaInject.showPending('#ad-slot', 'image_display', 'smartTag');
    return;
  }

  var tag = VisiblaInject.forTest(VisiblaInject.get('image_display', 'smartTag'));
  var iframe = document.createElement('iframe');
  iframe.id = 'testIframe';
  iframe.width = 320;
  iframe.height = 290;
  iframe.setAttribute('title', 'Image Smart Tag iframe');
  iframe.srcdoc = '<!DOCTYPE html><html><head><meta charset="UTF-8"><style>body{margin:0;background:#fff}</style></head><body>' +
    tag +
    '<script>setInterval(function(){parent.postMessage({type:"visibla-iframe",ts:Date.now()},"*");},500);<\/script>' +
    '</body></html>';
  var slot = document.getElementById('ad-slot');
  slot.innerHTML = '';
  slot.appendChild(iframe);
})();
</script>
</body>
</html>
